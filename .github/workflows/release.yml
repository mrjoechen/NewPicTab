name: Release

on:
  push:
    tags:
      - 'v*.*.*'

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  release:
    name: Build and publish release
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Validate release version
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          if [[ ! "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Expected a semantic version tag such as v1.2.3, got: $RELEASE_TAG" >&2
            exit 1
          fi

          release_version="${RELEASE_TAG#v}"
          manifest_version="$(node -p "require('./public/manifest.json').version")"

          if [[ "$release_version" != "$manifest_version" ]]; then
            echo "Tag and public/manifest.json versions must match." >&2
            echo "tag=$release_version manifest=$manifest_version" >&2
            exit 1
          fi

      - name: Install dependencies
        run: npm ci

      - name: Check and build extension
        run: npm run check

      - name: Package Chrome Web Store submission
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          archive="newpictab-${RELEASE_TAG}.zip"
          npm run package:chrome-store -- \
            --source dist \
            --output "$archive" \
            --version "${RELEASE_TAG#v}"
          sha256sum "$archive" > "${archive}.sha256"

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          archive="newpictab-${RELEASE_TAG}.zip"
          if gh release view "$RELEASE_TAG" > /dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" \
              "$archive" \
              "${archive}.sha256" \
              --clobber
          else
            gh release create "$RELEASE_TAG" \
              "$archive" \
              "${archive}.sha256" \
              --verify-tag \
              --generate-notes \
              --title "NewPicTab ${RELEASE_TAG}"
          fi
